# Test profile for repository slice tests: H2 in PostgreSQL-compatibility mode,
# schema generated by Hibernate (Flyway is disabled so the Postgres-specific
# seed migrations don't run against H2).
spring:
  datasource:
    url: jdbc:h2:mem:eboard_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
